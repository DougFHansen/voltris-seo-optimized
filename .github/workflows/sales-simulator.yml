name: Voltris Sales Simulator

on:
  schedule:
    # Roda a cada 5 minutos
    - cron: '*/5 * * * *'
  # Permite rodar manualmente também (botão "Run workflow")
  workflow_dispatch:

jobs:
  send-sale:
    runs-on: ubuntu-latest
    steps:
      - name: Send simulated sale to Telegram
        run: |
          curl -X GET "https://voltris.com.br/api/simulator/send-sale?key=voltris-sales-simulator-2026" \
            -H "Accept: application/json" \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5
